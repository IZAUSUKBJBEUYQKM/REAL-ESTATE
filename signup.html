<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Next Worth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .auth-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .auth-header {
            background: linear-gradient(135deg, #CC7722 0%, #e8a857 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .auth-toggle {
            display: flex;
            background: rgba(248, 249, 250, 0.8);
            border-bottom: 1px solid #e0e0e0;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            background: transparent;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .toggle-btn.active {
            background: linear-gradient(135deg, #CC7722 0%, #e8a857 100%);
            color: white;
        }
        
        .auth-form {
            padding: 2rem;
            background: rgba(248, 249, 250, 0.95);
        }
        
        .form-section {
            background: rgba(255, 255, 255, 0.8);
            padding: 1.5rem;
            border-radius: 15px;
            border-left: 4px solid #CC7722;
            margin-bottom: 1.5rem;
        }
        
        .form-section h6 {
            color: #CC7722;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #CC7722 0%, #e8a857 100%);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            font-weight: 600;
        }
        
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #b8661e 0%, #d4954d 100%);
        }
        
        .back-link {
            position: absolute;
            top: 1rem;
            left: 1rem;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
        }
        
        .back-link:hover {
            color: #f0f0f0;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #CC7722;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header position-relative">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            <h2 id="authTitle">Welcome to Next Worth</h2>
            <p>Join our property marketplace community</p>
        </div>
        
        <div class="auth-toggle">
            <button type="button" class="toggle-btn" id="loginToggle">
                <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
            <button type="button" class="toggle-btn active" id="signupToggle">
                <i class="fas fa-user-plus me-2"></i>Sign Up
            </button>
        </div>
        
        <div class="auth-form">
            <!-- Login Form -->
            <div id="loginForm" style="display: none;">
                <form id="loginFormElement">
                    <div class="form-section">
                        <h6><i class="fas fa-sign-in-alt me-2"></i>Login to Your Account</h6>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                                <input type="email" id="loginEmail" name="email" class="form-control" 
                                       placeholder="Enter your email address" required>
                            </div>
                            <div class="col-12">
                                <label for="loginPassword" class="form-label fw-semibold">Password</label>
                                <input type="password" id="loginPassword" name="password" class="form-control" 
                                       placeholder="Enter your password" required>
                            </div>
                        </div>
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Remember me for 30 days
                            </label>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="index.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom">
                            <span class="loading-spinner me-2"></span>
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </div>
                    <div class="mt-3 text-center">
                        <small><a href="#" id="forgotPassword" style="color: #CC7722; text-decoration: none;">Forgot your password?</a></small>
                    </div>
                    <div id="loginAlert"></div>
                </form>
            </div>
            
            <!-- Sign Up Form -->
            <div id="signupForm">
                <form id="signupFormElement">
                    <!-- Personal Information Section -->
                    <div class="form-section">
                        <h6><i class="fas fa-user me-2"></i>Personal Information</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label fw-semibold">First Name</label>
                                <input type="text" id="firstName" name="firstName" class="form-control" 
                                       placeholder="Enter your first name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label fw-semibold">Last Name</label>
                                <input type="text" id="lastName" name="lastName" class="form-control" 
                                       placeholder="Enter your last name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input type="email" id="email" name="email" class="form-control" 
                                       placeholder="Enter your email address" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" id="phone" name="phone" class="form-control" 
                                       placeholder="Enter your phone number" required>
                            </div>
                            <div class="col-12">
                                <label for="userType" class="form-label fw-semibold">Account Type</label>
                                <select id="userType" name="userType" class="form-select" required>
                                    <option value="" disabled selected>Select account type</option>
                                    <option value="buyer">Property Buyer</option>
                                    <option value="seller">Property Seller</option>
                                  
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Security Information Section -->
                    <div class="form-section">
                        <h6><i class="fas fa-lock me-2"></i>Security Information</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" id="password" name="password" class="form-control" 
                                       placeholder="Create a strong password" required>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" 
                                       placeholder="Confirm your password" required>
                            </div>
                        </div>
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                            <label class="form-check-label" for="terms">
                                I agree to the <a href="#terms" style="color: #CC7722;">Terms of Service</a> and 
                                <a href="#privacy" style="color: #CC7722;">Privacy Policy</a>
                            </label>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="index.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom">
                            <span class="loading-spinner me-2"></span>
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                    </div>
                    <div class="mt-3 text-center">
                        <small class="text-muted">Welcome to Next Worth!</small>
                    </div>
                    <div id="signupAlert"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-firestore-compat.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Firebase configuration - Replace with your own config
        const firebaseConfig = {
            apiKey: "AIzaSyDAU8NKfmwWri5hJQfx_dtMw8lxdlFrI0Q",
  authDomain: "nextworth-a0bb6.firebaseapp.com",
  projectId: "nextworth-a0bb6",
  storageBucket: "nextworth-a0bb6.firebasestorage.app",
  messagingSenderId: "923710068587",
  appId: "1:923710068587:web:8a910418ff6e78a9739e2e",
  measurementId: "G-GRFN7CG4M6"

        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Helper functions
        function showLoading(button) {
            const spinner = button.querySelector('.loading-spinner');
            spinner.style.display = 'inline-block';
            button.disabled = true;
        }

        function hideLoading(button) {
            const spinner = button.querySelector('.loading-spinner');
            spinner.style.display = 'none';
            button.disabled = false;
        }

        function showAlert(containerId, message, type = 'danger') {
            const alertContainer = document.getElementById(containerId);
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Save user data to Firestore
        async function saveUserData(uid, userData) {
            try {
                await db.collection('users').doc(uid).set({
                    firstName: userData.firstName,
                    lastName: userData.lastName,
                    email: userData.email,
                    phoneNumber: userData.phone,
                    userType: userData.userType,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLoginAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log('User data saved successfully');
            } catch (error) {
                console.error('Error saving user data:', error);
            }
        }

        // Update last login time
        async function updateLastLogin(uid) {
            try {
                await db.collection('users').doc(uid).update({
                    lastLoginAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error('Error updating last login:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loginToggle = document.getElementById('loginToggle');
            const signupToggle = document.getElementById('signupToggle');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const authTitle = document.getElementById('authTitle');
            
            // Toggle to login
            loginToggle.addEventListener('click', function() {
                loginToggle.classList.add('active');
                signupToggle.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                authTitle.textContent = 'Welcome Back';
            });
            
            // Toggle to signup
            signupToggle.addEventListener('click', function() {
                signupToggle.classList.add('active');
                loginToggle.classList.remove('active');
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
                authTitle.textContent = 'Create Your Account';
            });
            
            // Form validation
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            
            if (confirmPassword) {
                confirmPassword.addEventListener('input', function() {
                    if (password.value !== this.value) {
                        this.setCustomValidity('Passwords do not match');
                    } else {
                        this.setCustomValidity('');
                    }
                });
            }
            
            // Sign Up with Firebase
            const signupFormElement = document.getElementById('signupFormElement');
            if (signupFormElement) {
                signupFormElement.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const submitBtn = this.querySelector('button[type="submit"]');
                    showLoading(submitBtn);
                    
                    try {
                        const formData = new FormData(this);
                        const userData = Object.fromEntries(formData);
                        
                        // Create user with Firebase Auth
                        const userCredential = await auth.createUserWithEmailAndPassword(
                            userData.email, 
                            userData.password
                        );
                        
                        const user = userCredential.user;
                        
                        // Update user profile
                        await user.updateProfile({
                            displayName: `${userData.firstName} ${userData.lastName}`
                        });
                        
                        // Save additional user data to Firestore
                        await saveUserData(user.uid, userData);
                        
                        // Send email verification
                        await user.sendEmailVerification();
                        
                        showAlert('signupAlert', 
                            'Account created successfully! Please check your email for verification.', 
                            'success'
                        );
                        
                        // Redirect after 2 seconds
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                        
                    } catch (error) {
                        console.error('Signup error:', error);
                        let errorMessage = 'An error occurred during signup. Please try again.';
                        
                        switch (error.code) {
                            case 'auth/email-already-in-use':
                                errorMessage = 'This email is already registered. Please use a different email or try logging in.';
                                break;
                            case 'auth/weak-password':
                                errorMessage = 'Password is too weak. Please use at least 6 characters.';
                                break;
                            case 'auth/invalid-email':
                                errorMessage = 'Please enter a valid email address.';
                                break;
                        }
                        
                        showAlert('signupAlert', errorMessage);
                    } finally {
                        hideLoading(submitBtn);
                    }
                });
            }
            
            // Login with Firebase
            const loginFormElement = document.getElementById('loginFormElement');
            if (loginFormElement) {
                loginFormElement.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const submitBtn = this.querySelector('button[type="submit"]');
                    showLoading(submitBtn);
                    
                    try {
                        const formData = new FormData(this);
                        const loginData = Object.fromEntries(formData);
                        
                        // Sign in with Firebase Auth
                        const userCredential = await auth.signInWithEmailAndPassword(
                            loginData.email, 
                            loginData.password
                        );
                        
                        const user = userCredential.user;
                        
                        // Update last login time
                        await updateLastLogin(user.uid);
                        
                        showAlert('loginAlert', 
                            'Login successful! Welcome back.', 
                            'success'
                        );
                        
                        // Redirect after 1 second
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                        
                    } catch (error) {
                        console.error('Login error:', error);
                        let errorMessage = 'Login failed. Please check your credentials.';
                        
                        switch (error.code) {
                            case 'auth/user-not-found':
                                errorMessage = 'No account found with this email. Please sign up first.';
                                break;
                            case 'auth/wrong-password':
                                errorMessage = 'Incorrect password. Please try again.';
                                break;
                            case 'auth/invalid-email':
                                errorMessage = 'Please enter a valid email address.';
                                break;
                            case 'auth/too-many-requests':
                                errorMessage = 'Too many failed attempts. Please try again later.';
                                break;
                        }
                        
                        showAlert('loginAlert', errorMessage);
                    } finally {
                        hideLoading(submitBtn);
                    }
                });
            }
            
            // Forgot Password
            const forgotPasswordLink = document.getElementById('forgotPassword');
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('loginEmail').value;
                    
                    if (!email) {
                        showAlert('loginAlert', 'Please enter your email address first.');
                        return;
                    }
                    
                    try {
                        await auth.sendPasswordResetEmail(email);
                        showAlert('loginAlert', 
                            'Password reset email sent! Please check your inbox.', 
                            'success'
                        );
                    } catch (error) {
                        console.error('Password reset error:', error);
                        showAlert('loginAlert', 'Error sending password reset email. Please try again.');
                    }
                });
            }
            
            // Check authentication state
            auth.onAuthStateChanged(function(user) {
                if (user) {
                    console.log('User is signed in:', user.email);
                    // User is signed in, you can redirect or show user-specific content
                } else {
                    console.log('User is signed out');
                }
            });
        });
    </script>
</body>
</html>
