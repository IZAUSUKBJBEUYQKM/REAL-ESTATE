<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srinagar Land Price Predictor | Professional Real Estate Analysis</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #CC7722;
            --secondary-color: #6a8185;
            --accent-color: #e8a857;
            --success-color: #CC7722;
            --warning-color: #e67e22;
            --danger-color: #ff4757;
            --light-bg: rgba(242, 242, 242, 1);
            --dark-bg: #6c757d;
            --gradient-primary: linear-gradient(135deg, #CC7722 0%, #e8a857 100%);
            --gradient-secondary: linear-gradient(135deg, #6a8185 0%, #d0d7de 100%);
            --gradient-accent: linear-gradient(135deg, #e8a857 0%, #CC7722 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: rgba(242, 242, 242, 0.4);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #d0d7de;
        }

        .header-section {
            background: var(--gradient-primary);
            color: white;
            padding: 50px 40px;
            text-align: center;
            position: relative;
        }

        .header-section h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .header-section p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .prediction-form {
            padding: 40px;
            background: var(--light-bg);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 8px;
            display: block;
        }

        .form-select, .form-control {
            border: 2px solid #d0d7de;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }

        .form-select:focus, .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(204, 119, 34, 0.25);
            outline: none;
        }

        .btn-predict {
            background: var(--gradient-accent);
            border: none;
            border-radius: 12px;
            padding: 16px 40px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(204, 119, 34, 0.2);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(204, 119, 34, 0.3);
            color: white;
        }

        .results-section {
            padding: 40px;
            display: none;
        }

        .price-card {
            background: var(--gradient-accent);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(204, 119, 34, 0.2);
        }

        .price-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(204, 119, 34, 0.3);
        }

        .loading-spinner {
            text-align: center;
            padding: 60px;
            display: none;
        }

        .alert {
            border-radius: 8px;
            border: none;
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: rgba(204, 119, 34, 0.1);
            color: var(--success-color);
            border-left: 4px solid var(--success-color);
        }

        .alert-danger {
            background: rgba(255, 71, 87, 0.1);
            color: var(--danger-color);
            border-left: 4px solid var(--danger-color);
        }

        @media (max-width: 768px) {
            .main-container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .header-section {
                padding: 30px 20px;
            }
            
            .header-section h1 {
                font-size: 2rem;
            }
            
            .prediction-form {
                padding: 20px;
            }
            
            .results-section {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="header-content">
                <h1><i class="fas fa-chart-line"></i> Srinagar Land Price Predictor</h1>
                <p class="mb-3">Professional real estate price lookup for Srinagar district</p>
                <p class="small opacity-75">Find property prices based on your criteria</p>
            </div>
        </div>

        <!-- Prediction Form -->
        <div class="prediction-form">
            <h3 class="mb-4"><i class="fas fa-calculator"></i> Property Price Lookup</h3>
            
            <form id="predictionForm">
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-map"></i> District</label>
                            <select class="form-select" id="districtSelect" required>
                                <option value="srinagar" selected>Srinagar</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-map-marker-alt"></i> Village</label>
                            <select class="form-select" id="villageSelect" required>
                                <option value="">Select Village</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-location-dot"></i> Location</label>
                            <select class="form-select" id="locationSelect" required disabled>
                                <option value="">Select Location</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-building"></i> Property Type</label>
                            <select class="form-select" id="propertyTypeSelect" required>
                                <option value="">Select Type</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-road"></i> Road Type</label>
                            <select class="form-select" id="roadTypeSelect" required>
                                <option value="">Select Road Type</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-calendar-alt"></i> Year</label>
                            <select class="form-select" id="yearSelect" required>
                                <option value="">Select Year</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-predict btn-lg">
                        <i class="fas fa-search"></i> Find Price
                    </button>
                </div>
            </form>
        </div>

        <!-- Messages -->
        <div id="messageContainer" class="px-4"></div>

        <!-- Loading Spinner -->
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3"><strong>Fetching price data...</strong></p>
            <small>Please wait while we process your request</small>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <h3 class="mb-4"><i class="fas fa-tag"></i> Price Result</h3>
            
            <!-- Price Card -->
            <div class="row" id="priceCard">
                <!-- Price card will be populated here -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application JavaScript -->
    <script>
        // Global variables
        let propertyData = [];
        let villageLocationHierarchy = {};

        // Initialize application
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            setupEventListeners();
        });

        // Initialize app by loading both CSV and JSON data
        async function initializeApp() {
            try {
                await Promise.all([loadVillageHierarchy(), loadCSVData()]);
                populateDropdowns();
                showMessage('Price lookup system ready!', 'success');
            } catch (error) {
                showMessage('Error initializing application: ' + error.message, 'error');
            }
        }

        // Load village hierarchy from JSON file
        async function loadVillageHierarchy() {
            try {
                const response = await fetch('villageHierarchy.json');
                if (!response.ok) {
                    throw new Error('Failed to load village hierarchy');
                }
                villageLocationHierarchy = await response.json();
            } catch (error) {
                showMessage('Error loading village hierarchy: ' + error.message, 'error');
                throw error;
            }
        }

        // Load CSV data from external file
        async function loadCSVData() {
            try {
                const response = await fetch('propertyData.csv');
                const csvText = await response.text();
                
                return new Promise((resolve, reject) => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        dynamicTyping: true,
                        complete: function(results) {
                            propertyData = results.data.map(row => {
                                const cleanRow = {};
                                for (let key in row) {
                                    const cleanKey = key.trim().toLowerCase();
                                    cleanRow[cleanKey] = typeof row[key] === 'string' ? row[key].trim() : row[key];
                                }
                                return cleanRow;
                            });
                            resolve();
                        },
                        error: function(error) {
                            showMessage('Error parsing CSV data: ' + error.message, 'error');
                            reject(error);
                        }
                    });
                });
            } catch (error) {
                showMessage('Error loading CSV file. Please ensure propertyData.csv exists.', 'error');
                throw error;
            }
        }

        // Populate dropdowns
        function populateDropdowns() {
            // Populate villages
            const villages = Object.keys(villageLocationHierarchy).sort();
            populateSelect('villageSelect', villages);
            
            // Populate property types, road types, and years
            const propertyTypes = [...new Set(propertyData.map(row => row.property_type))].filter(v => v).sort();
            const roadTypes = [...new Set(propertyData.map(row => row.road_type))].filter(v => v).sort();
            const years = [...new Set(propertyData.map(row => row.year))].filter(v => v).sort((a, b) => a - b);
            
            populateSelect('propertyTypeSelect', propertyTypes);
            populateSelect('roadTypeSelect', roadTypes);
            populateSelect('yearSelect', years);
        }

        // Populate select element
        function populateSelect(elementId, options) {
            const select = document.getElementById(elementId);
            const currentValue = select.value;
            const placeholder = select.querySelector('option[value=""]').textContent;
            
            select.innerHTML = `<option value="">${placeholder}</option>`;
            
            options.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option;
                optionElement.textContent = capitalizeWords(option.toString());
                select.appendChild(optionElement);
            });
            
            if (currentValue && options.includes(currentValue)) {
                select.value = currentValue;
            }
        }

        // Load locations for selected village
        function loadLocations(village) {
            const locationSelect = document.getElementById('locationSelect');
            
            if (village && villageLocationHierarchy[village]) {
                locationSelect.innerHTML = '<option value="">Select Location</option>';
                
                const locations = villageLocationHierarchy[village].sort();
                locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = capitalizeWords(location);
                    locationSelect.appendChild(option);
                });
                
                locationSelect.disabled = false;
            } else {
                locationSelect.innerHTML = '<option value="">No locations found</option>';
                locationSelect.disabled = true;
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Village selection change
            document.getElementById('villageSelect').addEventListener('change', function(e) {
                const village = e.target.value;
                if (village) {
                    loadLocations(village);
                } else {
                    const locationSelect = document.getElementById('locationSelect');
                    locationSelect.innerHTML = '<option value="">Select Location</option>';
                    locationSelect.disabled = true;
                }
            });

            // Form submission
            document.getElementById('predictionForm').addEventListener('submit', handlePriceLookup);
        }

        // Handle price lookup form submission
        async function handlePriceLookup(event) {
            event.preventDefault();

            // Collect form data
            const formData = {
                village: document.getElementById('villageSelect').value,
                location: document.getElementById('locationSelect').value,
                property_type: document.getElementById('propertyTypeSelect').value,
                road_type: document.getElementById('roadTypeSelect').value,
                year: parseInt(document.getElementById('yearSelect').value)
            };

            // Validate form
            if (!validateForm(formData)) {
                return;
            }

            // Show loading
            showLoading(true);
            hideMessages();

            try {
                // Filter data based on criteria
                const matchingRecords = propertyData.filter(row => 
                    row.village === formData.village &&
                    row.location === formData.location &&
                    row.property_type === formData.property_type &&
                    row.road_type === formData.road_type &&
                    row.year === formData.year
                );

                if (matchingRecords.length > 0) {
                    // Display the exact price without rounding
                    displayPrice(matchingRecords[0].price_lakhs, formData.year);
                    showMessage('Price retrieved successfully!', 'success');
                } else {
                    showMessage('No price found for the selected criteria', 'error');
                    document.getElementById('resultsSection').style.display = 'none';
                }
            } catch (error) {
                showMessage('Error retrieving price: ' + error.message, 'error');
                document.getElementById('resultsSection').style.display = 'none';
            } finally {
                showLoading(false);
            }
        }

        // Validate form data
        function validateForm(formData) {
            const requiredFields = ['village', 'location', 'property_type', 'road_type', 'year'];

            for (const field of requiredFields) {
                if (!formData[field]) {
                    showMessage(`Please select ${field.replace('_', ' ')}`, 'error');
                    return false;
                }
            }

            return true;
        }

        // Display price in a single card
        function displayPrice(price, year) {
            const priceCard = document.getElementById('priceCard');
            // Format price to match CSV precision (up to 3 decimal places if present)
            const formattedPrice = Number.isInteger(price) ? price.toString() : price.toFixed(3);
            priceCard.innerHTML = `
                <div class="col-md-4 col-sm-6 mb-3">
                    <div class="price-card">
                        <h5><i class="fas fa-calendar"></i> ${year}</h5>
                        <h3>₹${formattedPrice} Lakhs</h3>
                        <p>₹${(price * 100000).toLocaleString('en-IN')}</p>
                        <small>Price for selected criteria</small>
                    </div>
                </div>
            `;
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
        }

        // Utility functions
        function capitalizeWords(str) {
            return str.split(' ').map(word =>
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        function showLoading(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
        }

        function showMessage(message, type) {
            const messageContainer = document.getElementById('messageContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
            const icon = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle';

            messageContainer.innerHTML = `
                <div class="alert ${alertClass}" role="alert">
                    <i class="${icon}"></i> ${message}
                </div>
            `;

            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => hideMessages(), 5000);
            }
        }

        function hideMessages() {
            document.getElementById('messageContainer').innerHTML = '';
        }
    </script>
</body>
</html>
